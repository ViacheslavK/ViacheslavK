name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate profile summary cards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate dark theme cards
        uses: vn7n24fzkq/github-profile-summary-cards@v0.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          TIME_ZONE: Europe/Warsaw
          THEME: github_dark
          ANIMATION: load
          AUTO_PUSH: false

      - name: Preserve dark theme cards
        run: |
          rm -rf /tmp/github_dark
          mv profile-summary-card-output/github_dark /tmp/github_dark

      - name: Generate light theme cards
        uses: vn7n24fzkq/github-profile-summary-cards@v0.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          TIME_ZONE: Europe/Warsaw
          THEME: github
          ANIMATION: load
          AUTO_PUSH: false

      - name: Restore dark theme cards and push
        run: |
          mv /tmp/github_dark profile-summary-card-output/github_dark
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          if git diff --cached --quiet; then
            echo "No changes to profile summary cards."
          else
            git commit -m "chore: update profile summary cards"
            git push origin HEAD:main
          fi
