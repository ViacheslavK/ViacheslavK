name: Latest Blog Posts

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull latest blog posts
        uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://slavaqa.pp.ua/index.xml"
          max_post_count: 5
          date_format: "yyyy-mm-dd"
          template: "- [$title]($url) ($date)"
          commit_message: "chore: update recent blog posts"
